# Publishes the site to GitHub Pages on every push to main.
# Settings > Pages > Build and deployment > Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@v6
      - name: Check links and HTML basics
        run: |
          for f in index.html 404.html; do
            grep -q '<title>' "$f" || { echo "$f has no title"; exit 1; }
          done
          if grep -q 'YOUR-LINKEDIN-HANDLE' index.html; then
            echo "Replace the LinkedIn placeholder in index.html before publishing"; exit 1
          fi
      - name: Stage the site
        run: |
          mkdir _site
          cp -R index.html 404.html robots.txt sitemap.xml .nojekyll assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
